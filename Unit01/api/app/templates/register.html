<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 flex items-center justify-center">
    <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-lg">
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-semibold text-slate-900">Create an account</h1>
        <p class="text-sm text-slate-500">Start building your app with your own account.</p>
      </div>
      {% if error %}
      <div class="mb-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/register" class="space-y-4">
        <label class="block text-sm font-medium text-slate-700" for="name">Name</label>
        <input
          id="name"
          name="name"
          type="text"
          required
          class="w-full rounded-lg border border-slate-200 bg-white p-3 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />

        <label class="block text-sm font-medium text-slate-700" for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          required
class="w-full rounded-lg border border-slate-200 bg-white p-3 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />

        <label class="block text-sm font-medium text-slate-700" for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full rounded-lg border border-slate-200 bg-white p-3 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />

        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow hover:bg-indigo-700"
        >
          Create account
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account? <a href="/login" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign in</a>
      </p>
    </div>
  </body>
</html>
